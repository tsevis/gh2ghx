[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gh2ghx"
version = "0.1.0"
description = "Grasshopper GH to GHX converter with structured binary fallback"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "tsevis" }
]
keywords = ["grasshopper", "gh", "ghx", "converter", "tkinter"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Topic :: Utilities",
]

[project.scripts]
gh2ghx = "gh2ghx.app:run"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
gh2ghx = ["assets/icons/*"]

[tool.setuptools.packages.find]
where = ["."]
include = ["gh2ghx*"]

